<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>4everChats</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.aurora{background:linear-gradient(135deg,#a3e635 0%,#4ade80 25%,#2dd4bf 50%,#38bdf8 75%,#a78bfa 100%);min-height:100dvh}
.hidden{display:none!important}
.chat-bg{background:#f0f2f5}
.msg{max-width:75%;padding:8px 12px;border-radius:18px;font-size:15px;line-height:1.4;word-wrap:break-word}
.me{background:#00a884;color:#fff;border-bottom-right-radius:4px;margin-left:auto}
.them{background:#fff;border-bottom-left-radius:4px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
</style>
</head>
<body>

<!-- LANDING -->
<div id="landing" class="aurora flex flex-col p-5 pb-8">
  <div class="flex justify-between items-center">
    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-green-400 via-blue-400 to-purple-500 flex items-center justify-center text-2xl shadow-lg">💬</div>
    <select class="bg-black/10 rounded-full px-3 py-2 text-sm font-bold"><option>English</option><option>Español</option><option>Français</option></select>
  </div>
  <h1 class="text-[52px] leading-[0.95] font-black tracking-tight mt-8">Chat<br>Forever.<br><span class="text-white">With Anyone.</span><br>Anywhere.</h1>
  <p class="font-semibold mt-3">Built in Jamaica - for the whole world.</p>
  <div class="mt-auto flex flex-col gap-3 pt-10">
    <button onclick="openAuth('start')" class="w-full bg-black text-white font-bold py-4 rounded-full text-[17px] active:scale-[0.98]">Start Chatting</button>
    <button onclick="openAuth('login')" class="w-full bg-white/60 backdrop-blur font-bold py-4 rounded-full text-[15px] text-blue-600 active:scale-[0.98]">Login</button>
    <p class="text-center text-xs opacity-70 font-medium">No phone number needed • Free forever</p>
  </div>
</div>

<!-- AUTH MODAL -->
<div id="auth" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="bg-white w-full sm:max-w-sm rounded-t-[28px] sm:rounded-[28px] p-6 pb-8">
    <div class="flex justify-between items-center"><h2 id="authTitle" class="text-2xl font-black">Start Chatting</h2><button onclick="closeAuth()" class="text-2xl w-8 h-8">✕</button></div>
    <p id="authSub" class="text-gray-500 text-sm mt-1">Pick a username to continue.</p>
    <label class="block text-xs font-bold text-gray-500 mt-6">USERNAME</label>
    <input id="usernameInput" placeholder="e.g. CodeE" class="w-full border-2 border-gray-200 rounded-2xl px-4 py-3.5 mt-1 text-[16px] outline-none focus:border-green-500">
    <label class="block text-xs font-bold text-gray-500 mt-4">DISPLAY NAME (OPTIONAL)</label>
    <input id="displayInput" placeholder="e.g. Kingston King" class="w-full border-2 border-gray-200 rounded-2xl px-4 py-3.5 mt-1 text-[16px] outline-none focus:border-green-500">
    <button onclick="enterApp()" class="w-full bg-black text-white font-bold py-4 rounded-full mt-6 active:scale-[0.98]">Continue →</button>
    <p class="text-center text-[11px] text-gray-400 mt-3">By continuing you agree to be kind. No spam.</p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden chat-bg min-h-[100dvh] flex flex-col">
  <div class="bg-[#075e54] sm:bg-[#008069] text-white px-4 py-3 flex items-center justify-between sticky top-0 z-10">
    <div><div class="font-bold text-[19px] leading-none">4everChats</div><div id="myNameLabel" class="text-[12px] opacity-80 mt-0.5">@you • Online</div></div>
    <button onclick="logout()" class="bg-white/20 px-3 py-1.5 rounded-full text-xs font-bold">Log out</button>
  </div>
  <div class="flex flex-1 overflow-hidden">
    <!-- CONTACTS -->
    <div id="contactsPane" class="w-full sm:w-[340px] bg-white border-r flex flex-col">
      <div class="p-3"><input oninput="filterContacts(this.value)" placeholder="Search or start new chat" class="w-full bg-[#f0f2f5] rounded-full px-4 py-2.5 text-sm outline-none"></div>
      <div id="contactsList" class="flex-1 overflow-y-auto"></div>
      <div class="p-3 border-t"><button onclick="newChat()" class="w-full bg-black text-white font-bold py-3 rounded-full text-sm">+ New Chat</button></div>
    </div>
    <!-- CHAT -->
    <div id="chatPane" class="hidden sm:flex flex-1 flex-col bg-[#efeae2]">
      <div class="bg-white px-4 py-3 flex items-center gap-3 shadow-sm">
        <button onclick="showContacts()" class="sm:hidden text-xl">←</button>
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-green-400 to-blue-500 flex items-center justify-center text-white font-bold text-lg" id="chatAvatar">J</div>
        <div class="flex-1"><div id="chatName" class="font-bold">Select a chat</div><div class="text-xs text-green-600">Online • replies instantly</div></div>
        <button onclick="clearChat()" class="text-xs bg-gray-100 px-3 py-1.5 rounded-full font-bold">Clear</button>
      </div>
      <div id="messages" class="flex-1 overflow-y-auto p-3 flex flex-col gap-2"></div>
      <div class="bg-white p-2 flex gap-2 items-center">
        <input id="msgInput" placeholder="Message" class="flex-1 bg-[#f0f2f5] rounded-full px-4 py-3 outline-none text-[15px]" onkeydown="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()" class="w-11 h-11 rounded-full bg-[#00a884] text-white text-xl flex items-center justify-center shrink-0">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
let me = localStorage.getItem('4ever_user') || '';
let current = 'Jamaica Group';
let chats = JSON.parse(localStorage.getItem('4ever_chats') || '{}');
let contacts = [
  {name:'Jamaica Group', last:'Welcome to 4everChats! 🇯🇲', avatar:'J', color:'from-green-400 to-blue-500'},
  {name:'Kingston Vibes', last:'Wah gwaan? 🔥', avatar:'K', color:'from-yellow-400 to-orange-500'},
  {name:'World Chat', last:'Hello from around the world 🌍', avatar:'W', color:'from-purple-400 to-pink-500'},
  {name:'4ever Support', last:'We are here to help you', avatar:'4', color:'from-blue-400 to-cyan-500'}
];
function openAuth(mode){
  document.getElementById('auth').classList.remove('hidden');
  document.getElementById('authTitle').textContent = mode==='login' ? 'Welcome Back' : 'Start Chatting';
  document.getElementById('authSub').textContent = mode==='login' ? 'Login with your username.' : 'Pick a username to continue.';
  setTimeout(()=>document.getElementById('usernameInput').focus(),100);
}
function closeAuth(){ document.getElementById('auth').classList.add('hidden'); }
function enterApp(){
  let u = document.getElementById('usernameInput').value.trim();
  let d = document.getElementById('displayInput').value.trim();
  if(!u){ alert('Please enter a username'); return; }
  me = u; localStorage.setItem('4ever_user', u);
  if(d) localStorage.setItem('4ever_display', d);
  document.getElementById('landing').classList.add('hidden');
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('myNameLabel').textContent = '@'+u+' • Online';
  renderContacts(); openChat(current);
}
function logout(){ localStorage.removeItem('4ever_user'); location.reload(); }
function renderContacts(filter=''){
  let list = document.getElementById('contactsList');
  list.innerHTML = contacts.filter(c=>c.name.toLowerCase().includes(filter.toLowerCase())).map(c=>{
    let msgs = chats[c.name]||[];
    let last = msgs.length ? msgs[msgs.length-1].text : c.last;
    return `<div onclick="openChat('${c.name}')" class="flex items-center gap-3 px-4 py-3 border-b border-gray-50 cursor-pointer active:bg-gray-50">
      <div class="w-12 h-12 rounded-full bg-gradient-to-br ${c.color} flex items-center justify-center text-white font-bold text-lg shrink-0">${c.avatar}</div>
      <div class="flex-1 min-w-0"><div class="font-semibold truncate">${c.name}</div><div class="text-[13px] text-gray-500 truncate">${last}</div></div>
      <div class="text-[11px] text-gray-400">now</div></div>`;
  }).join('');
}
function filterContacts(v){ renderContacts(v); }
function openChat(name){
  current = name;
  let c = contacts.find(x=>x.name===name) || contacts[0];
  document.getElementById('chatName').textContent = name;
  document.getElementById('chatAvatar').textContent = c.avatar;
  if(window.innerWidth < 640){ document.getElementById('contactsPane').classList.add('hidden'); document.getElementById('chatPane').classList.remove('hidden'); document.getElementById('chatPane').classList.add('flex'); }
  renderMessages();
}
function showContacts(){ document.getElementById('contactsPane').classList.remove('hidden'); document.getElementById('chatPane').classList.add('hidden'); document.getElementById('chatPane').classList.remove('flex'); }
function renderMessages(){
  let box = document.getElementById('messages');
  let msgs = chats[current] || [];
  if(msgs.length===0){
    msgs = [{from:'them', text:'Welcome to '+current+'! 🎉 This is your 4everChats. Send a message to get started.'}];
    chats[current]=msgs; saveChats();
  }
  box.innerHTML = msgs.map(m=>`<div class="msg ${m.from==='me'?'me':'them'}">${escapeHtml(m.text)}<div class="text-[10px] opacity-60 text-right mt-1">${m.time||'now'}</div></div>`).join('');
  box.scrollTop = box.scrollHeight;
  renderContacts();
}
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function sendMsg(){
  let inp = document.getElementById('msgInput');
  let t = inp.value.trim(); if(!t) return;
  if(!chats[current]) chats[current]=[];
  chats[current].push({from:'me', text:t, time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});
  saveChats(); inp.value=''; renderMessages();
  setTimeout(()=>{
    let replies = ['Nice! 🔥','Wah gwaan! Welcome to 4everChats 🇯🇲','Fr fr 😂','Say it again for the people in the back!','Love that for you 💚','Real talk!'];
    chats[current].push({from:'them', text:replies[Math.floor(Math.random()*replies.length)], time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});
    saveChats(); renderMessages();
  }, 800);
}
function saveChats(){ localStorage.setItem('4ever_chats', JSON.stringify(chats)); }
function clearChat(){ if(confirm('Clear this chat?')){ chats[current]=[]; saveChats(); renderMessages(); } }
function newChat(){
  let n = prompt('Enter name for new chat:'); if(!n) return;
  contacts.unshift({name:n, last:'New chat started', avatar:n[0].toUpperCase(), color:'from-green-400 to-blue-500'});
  renderContacts(); openChat(n);
}
// Auto-login if already logged in
if(me){ document.getElementById('landing').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); document.getElementById('myNameLabel').textContent='@'+me+' • Online'; renderContacts(); openChat(current); }
</script>
</body>
</html>
